[package]
name = "mt-text"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Text engine for manga-typesetter: font parsing, shaping, metrics and glyph raster"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["paint"]
# The painter is behind a feature so its size cost can be measured on its own.
# It needs no crate the rest of the engine does not already use.
paint = []
# The rasterisers the painter's own was measured against, each selectable at
# run time through `mt_paint_rasterizer`. For `parity/raster.mjs` only; never
# in a shipped build. One feature each so each one's size can be read off.
raster-tiny-skia = ["paint", "dep:tiny-skia"]
raster-zeno = ["paint", "dep:zeno"]
raster-vello = ["paint", "dep:vello_cpu"]
raster-compare = ["raster-tiny-skia", "raster-zeno", "raster-vello"]
# tiny-skia's SIMD paths, for the comparison build. Only takes effect when the
# target has the instructions, i.e. with RUSTFLAGS="-C target-feature=+simd128".
simd = ["tiny-skia?/simd"]

[dependencies]
harfrust = { version = "0.14", default-features = false, features = ["std"] }
skrifa = { version = "0.48", default-features = false, features = ["std"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std"], optional = true }
unicode-linebreak = "0.1.5"
vello_cpu = { version = "0.2.0", default-features = false, features = ["std", "u8_pipeline"], optional = true }
zeno = { version = "0.3.3", default-features = false, features = ["eval", "std"], optional = true }

[[example]]
name = "paint_hash"
required-features = ["paint"]

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = true
