[package]
name = "app"
version = "0.3.1"
description = "Lettering for scanlation, without Photoshop"
authors = ["k-omiq"]
license = "MIT"
repository = "https://github.com/komiq-cc/manga-typesetter"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# This crate only. The brush corpus test pushes a third of a billion pixels
# through a Lanczos filter, and `image::imageops::resize` is generic, so it is
# code-generated here rather than in `image` and inherits this crate's setting -
# unoptimised that test is three minutes instead of seconds. The dependency tree
# is untouched, so nothing else has to rebuild.
[profile.dev.package.app]
opt-level = 2

[features]
# GPU execution providers the OS does not imply. Windows gets CUDA + DirectML
# and macOS CoreML from the target-specific `ort` entries below; these two are
# for Linux, where pyke ships one prebuilt onnxruntime per provider so a build
# carries exactly one of them:
#   gpu-webgpu - any Vulkan-capable GPU (NVIDIA, AMD, Intel), nothing to install.
#   gpu-cuda   - NVIDIA only, needs CUDA 13 + cuDNN 9 on the user's machine,
#                and its provider libraries beside the executable
#                (see tauri.linux-cuda.conf.json).
# Both at once matches no prebuilt and ort-sys refuses to build.
#
# Linux releases are built on Ubuntu 24.04 (glibc 2.39 floor). x86_64 uses
# `gpu-webgpu` and falls back to CPU on GPU-less machines. ARM64 is CPU-only:
# pyke ships an aarch64 ONNX Runtime without a GPU provider, but no aarch64
# WebGPU or CUDA distribution. build.rs prints a note when a Linux build has
# neither feature.
gpu-webgpu = ["ort/webgpu"]
gpu-cuda = ["ort/cuda"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# The only outbound requests this app makes are `detect::engine` streaming the
# ONNX weights down, and every one of those URLs is https (huggingface.co,
# github.com) - so a TLS backend is unavoidable. rustls rather than native-tls
# keeps the "no OpenSSL, no system crypto library" spirit of
# default-features = false. Nothing else is needed: the download reads raw
# `chunk()`s, so no `json`, and the multipart upload died with the sidecar.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# libproc/rusage bindings for the process-memory report (see src/memory.rs).
# Already in the dep tree via tauri; declared because this crate calls it.
libc = "0.2"
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }
# Declared only for build-script ordering. `ort-sys` sets `links`, and cargo
# orders a build script after the build scripts of the `links` packages it
# depends on DIRECTLY - a transitive one (`ort` -> `ort-sys`) gets no edge, so
# without this line build.rs and ort-sys's build script run in parallel and
# `stage_gpu_libs` reads the execution-provider libraries before ort-sys has
# put them there. On a cold CI cache that is a build failure, not a flake:
# ort-sys spends the whole download in front of us.
ort-sys = { version = "2.0.0-rc.13", default-features = false }
# Page decoding for the detection engine (`detect::analyze::decode_image`).
# Every format the picker offers (`IMAGE_EXTENSIONS` in src/lib/importer.js) is
# listed here, and each is a pure-Rust decoder - no C library to ship beside the
# binary. The webview decodes a WebP page happily to draw and measure it, so a
# WebP chapter imported cleanly and then failed detection on every page.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
# Brush import (src/brush). A `.sut` is a SQLite database whose material blobs
# are TAR archives of zlib-compressed tiles, so all three are the file format,
# not a service. rusqlite is `bundled` so the parser never depends on whatever
# libsqlite3 the host happens to ship, and it only ever opens READ_ONLY.
rusqlite = { version = "0.40", features = ["bundled"] }
tar = "0.4"
flate2 = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# System font scan (src/system_fonts.rs). Pure Rust: it walks the platform's
# font directories itself (reading fontconfig's XML on Linux) and parses only
# the naming tables, so nothing is linked and no font bytes cross to the webview.
fontdb = "0.24"

# Execution providers are per-OS `ort` features: each one selects a different
# prebuilt onnxruntime, and a provider the target cannot have (CoreML off a
# Mac) makes ort-sys fail to find binaries. See src/detect/accel.rs for the
# order they are tried in.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.10", features = ["coreml"] }
# The colour picker's eyedropper (src/screen_color.rs): AppKit's NSColorSampler,
# because WKWebView has no EyeDropper. Both crates are already in the tree via tao.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSColor", "NSColorSampler", "NSColorSpace"] }
block2 = "0.6"

# One archive carries both: CUDA for NVIDIA machines with CUDA 13 + cuDNN 9
# installed, DirectML for every other GPU. The provider DLLs it ships are
# staged by build.rs and bundled by tauri.windows.conf.json.
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.10", features = ["cuda", "directml"] }
